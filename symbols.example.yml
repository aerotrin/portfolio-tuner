# Symbol Configuration for Portfolio Tuner

# HOW TO USE THIS FILE
# - Copy this file to symbols.yml in the project root, then edit it there.
# - Add or remove symbols in each group's symbols: list as needed.
# - Only use ticker symbols supported by your data provider (e.g. Financial Modeling Prep).
# - To specify a non-US exchange, add its suffix code to the symbol. Currently supported: .TO (Toronto).
# - To comment out (disable) a symbol, start the line with #.
# - Keep in mind: more symbols = slower refreshes. Check your subscription's API limits before bulk adding symbols.
#
# GROUP ATTRIBUTES
# Every section below is a list of groups, and every group is written the same
# way: region, type, label, then symbols.
#
# - region: optional, defaults to "Global". Suggested values: US, Canada, World, Global.
# - type:   optional, defaults to "Other". Suggested values: Equity, Fixed Income,
#           Multi-Asset, Commodity, Crypto, Forex, Index.
# - label:  required. Names a concept and is meant to repeat across regions and
#           types — see the three "Core" groups below. Only the region + type +
#           label combination has to be unique.
#
# Suggested values sort first in the filter chips; any other value is accepted and
# sorts after them. region and type drive the Region / Type filters on the market
# pages only — they are never validated against a symbol's exchange or holdings.
#
# The group filter lists each label once, so selecting "Core" with no region chosen
# gives you every region's Core group; pick a region to narrow it.

# Required ------------------------------
benchmarks:
  - region: Global
    type: Index
    label: Benchmarks
    symbols:
      - ^GSPC
      - ^IXIC
      - ^DJI
      - ^GSPTSE

snapshot:
  - region: Global
    type: Index
    label: Market Snapshot
    symbols:
      - ^GSPC
      - ^IXIC
      - ^DJI
      - ^GSPTSE
      - ^VIX

# Select market ETFs labelled by theme. Do not add stocks here.
